<div id="rexflow-widget" style="all:revert;">
  <button id="rexflow-toggle" style="position:fixed;bottom:24px;right:24px;z-index:99999;width:64px;height:64px;border-radius:50%;border:none;background:linear-gradient(135deg,#FFD700,#FFA500);color:#0A0A0F;font-size:28px;cursor:pointer;box-shadow:0 4px 24px rgba(255,215,0,0.4);display:flex;align-items:center;justify-content:center;transition:all 0.3s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;" onclick="toggleRW()" aria-label="Open consultant chat">
    <span>💬</span>
    <span id="rw-badge" style="position:absolute;top:-4px;right:-4px;background:#FF3333;color:white;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;">0</span>
  </button>
  <div id="rw-chat" style="position:fixed;bottom:104px;right:24px;z-index:99998;width:400px;height:540px;background:#0D0D1A;border:1px solid #1a1a2e;border-radius:20px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;">
    <div style="background:linear-gradient(135deg,#111122,#0d0d1a);padding:18px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #1a1a2e;">
      <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#FFD700,#FFA500);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#0A0A0F;">R</div>
      <div style="flex:1;"><div style="font-weight:700;font-size:15px;color:#fff;">Rexflow Consultant</div><div style="font-size:12px;color:#4CAF50;">● Онлайн</div></div>
      <button onclick="toggleRW()" style="background:none;border:none;color:#666;font-size:20px;cursor:pointer;padding:4px 8px;">✕</button>
    </div>
    <div id="rw-messages" style="flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:#0A0A0F;">
      <div style="background:transparent;align-self:center;color:#555;font-size:11px;text-align:center;padding:4px 10px;">Здравствуйте! Задайте вопрос — ответит в течение минуты.</div>
    </div>
    <div style="display:flex;gap:10px;padding:14px 16px;border-top:1px solid #1a1a2e;background:#0d0d14;">
      <input type="text" id="rw-input" placeholder="Напишите вопрос..." onkeydown="if(event.key==='Enter')sendRW()" style="flex:1;background:#14142a;border:1px solid #1a1a2e;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;outline:none;">
      <button onclick="sendRW()" id="rw-send" style="background:linear-gradient(135deg,#FFD700,#FFA500);color:#0A0A0F;border:none;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;">→</button>
    </div>
  </div>
</div>
