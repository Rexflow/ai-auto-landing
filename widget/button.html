<div id="rexflow-widget" style="position:fixed;bottom:24px;right:24px;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <button id="rexflow-toggle" onclick="toggleRW()" style="display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#111122,#0d0d1a);border:1px solid rgba(255,215,0,0.25);border-radius:3px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.4);transition:all 0.3s;">
    <span style="position:relative;width:10px;height:10px;">
      <span style="position:absolute;inset:0;background:#4CAF50;border-radius:50%;animation:rwPulse 2s infinite;"></span>
    </span>
    <span style="color:#4CAF50;font-size:13px;font-weight:600;">Rex онлайн</span>
    <span style="color:#FFD700;font-size:16px;margin-left:2px;">💬</span>
  </button>
  <div id="rw-chat" style="position:absolute;bottom:60px;right:0;width:380px;height:520px;background:#0D0D1A;border:1px solid #1a1a2e;border-radius:16px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);">
    <div style="background:linear-gradient(135deg,#111122,#0d0d1a);padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1a1a2e;">
      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FFD700,#FFA500);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#0A0A0F;">R</div>
      <div style="flex:1;"><div style="font-weight:700;font-size:14px;color:#fff;">Rexflow Consultant</div><div style="font-size:11px;color:#4CAF50;">● Онлайн</div></div>
      <button onclick="toggleRW()" style="background:none;border:none;color:#666;font-size:16px;cursor:pointer;padding:4px;">✕</button>
    </div>
    <div id="rw-messages" style="flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:#0A0A0F;">
      <div style="background:#14142a;align-self:flex-start;border-bottom-left-radius:4px;color:#e0e0e0;padding:10px 14px;font-size:13px;max-width:82%;">Здравствуйте! Задайте вопрос — ответим в течение минуты.</div>
    </div>
    <div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid #1a1a2e;background:#0d0d14;">
      <input type="text" id="rw-input" placeholder="Напишите вопрос..." onkeydown="if(event.key==='Enter')sendRW()" style="flex:1;background:#14142a;border:1px solid #1a1a2e;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;outline:none;">
      <button onclick="sendRW()" id="rw-send" style="background:linear-gradient(135deg,#FFD700,#FFA500);color:#0A0A0F;border:none;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;">→</button>
    </div>
  </div>
  <style>@keyframes rwPulse{0%,100%{box-shadow:0 0 0 0 rgba(76,175,80,0.4);}50%{box-shadow:0 0 0 6px rgba(76,175,80,0);}}</style>
</div>
